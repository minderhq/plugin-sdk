[build-system]
requires = ["setuptools>=68", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "minder-plugin-sdk"
version = "0.1.0"
description = "Authoring SDK & contract for Minder module plugins."
readme = "README.md"
requires-python = ">=3.11"
license = { text = "Apache-2.0" }
authors = [{ name = "minderhq" }]
keywords = ["minder", "plugin", "sdk", "ai-tools", "ollama"]
classifiers = [
    "License :: OSI Approved :: Apache Software License",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Typing :: Typed",
]
# The contract itself is dependency-free (stdlib only). Plugins that make HTTP
# calls typically add httpx; that is the plugin's dependency, not the SDK's.
dependencies = []

[project.optional-dependencies]
# Full JSON-Schema config/manifest validation (else a light built-in validator).
jsonschema = ["jsonschema>=4"]
# Parse YAML manifests (else pass an already-parsed dict).
yaml = ["pyyaml>=6"]
examples = ["httpx>=0.27"]
# `minder-plugin serve` and the T4 remote-plugin helpers (t4, t4_server,
# t4_callbacks). Imported lazily: the base package stays dependency-free.
serve = [
    "starlette>=0.37",
    "uvicorn>=0.29",
    "cryptography>=42",
    "httpx>=0.27",
]
# `minder-plugin try` and the minder_t0_engine package (the T0 declarative
# connector engine the runner uses).
t0 = [
    "httpx>=0.27",
    "jmespath>=1.0",
    "defusedxml>=0.7",
    "pydantic>=2",
    "jsonschema>=4",
    "pyyaml>=6",
]
dev = [
    "pytest>=8",
    "pytest-asyncio>=0.23",
    "mypy>=1.8",
    "black>=24",
    "flake8>=7",
    "httpx>=0.27",
    "pyyaml>=6",
    "jsonschema>=4",
    "types-pyyaml",
    "types-jsonschema",
    "starlette>=0.37",
    "uvicorn>=0.29",
    "cryptography>=42",
    "jmespath>=1.0",
    "defusedxml>=0.7",
    "pydantic>=2",
    "types-jmespath",
    "types-defusedxml",
]

[project.scripts]
minder-plugin = "minder_plugin_sdk.cli:main"

[project.urls]
Homepage = "https://github.com/minderhq/plugin-sdk"
Source = "https://github.com/minderhq/plugin-sdk"
Issues = "https://github.com/minderhq/plugin-sdk/issues"

[tool.setuptools.packages.find]
where = ["src"]

[tool.setuptools.package-data]
minder_plugin_sdk = ["py.typed", "schemas/*.json"]
minder_t0_engine = ["py.typed"]

[tool.pytest.ini_options]
asyncio_mode = "auto"

[tool.black]
line-length = 88

[tool.mypy]
python_version = "3.11"
strict = true
