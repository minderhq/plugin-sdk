[build-system]
requires = ["setuptools>=68", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "minder-plugin-sdk"
version = "0.1.0"
description = "Authoring SDK & contract for Minder module plugins."
readme = "README.md"
requires-python = ">=3.11"
license = { text = "Apache-2.0" }
authors = [{ name = "minderhq" }]
keywords = ["minder", "plugin", "sdk", "ai-tools", "ollama"]
classifiers = [
    "License :: OSI Approved :: Apache Software License",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Typing :: Typed",
]
# The contract itself is dependency-free (stdlib only). Plugins that make HTTP
# calls typically add httpx; that is the plugin's dependency, not the SDK's.
dependencies = []

[project.optional-dependencies]
dev = ["pytest>=8", "mypy>=1.8", "black>=24", "flake8>=7"]
examples = ["httpx>=0.27"]

[project.urls]
Homepage = "https://github.com/minderhq/plugin-sdk"
Source = "https://github.com/minderhq/plugin-sdk"
Issues = "https://github.com/minderhq/minder/issues"

[tool.setuptools.packages.find]
where = ["src"]

[tool.setuptools.package-data]
minder_plugin_sdk = ["py.typed"]

[tool.black]
line-length = 88

[tool.mypy]
python_version = "3.11"
strict = true
