name: Publish to PyPI

# Publishes minder-plugin-sdk to PyPI when a GitHub Release is published.
# Uses PyPI Trusted Publishing (OIDC) — no API token/secret needed. Configure
# the trusted publisher once on PyPI: project `minder-plugin-sdk`, owner
# `minderhq`, repo `plugin-sdk`, workflow `publish.yml`, environment `pypi`.

on:
  release:
    types: [published]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build:
    name: Build sdist + wheel
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      # SHA-pinned like the publish action below. No dependency cache: this is
      # a release build, so it resolves the build backend fresh rather than
      # from a cache another run could have written.
      - uses: astral-sh/setup-uv@1c37ad07a6a961277cf70c0d37d6f313000f5884 # v10.3.0
        with:
          python-version: "3.12"
          enable-cache: false
      - run: uv build
      - uses: actions/upload-artifact@v7
        with:
          name: dist
          path: dist/

  pypi:
    name: Publish to PyPI
    needs: build
    runs-on: ubuntu-latest
    environment: pypi
    permissions:
      id-token: write # required for Trusted Publishing (OIDC)
    steps:
      - uses: actions/download-artifact@v8
        with:
          name: dist
          path: dist/
      # SHA-pinned, not the mutable `release/v1` branch ref this action
      # publishes its docs under (org convention since the TruffleHog
      # CVE-2026-33634 incident) -- verified via releases/latest -> git/tags
      # (an annotated tag here, dereferenced through git/tags/<sha> to the
      # actual commit) against the same v1.14.2 the branch currently points to.
      - uses: pypa/gh-action-pypi-publish@7245906fb61fa33a13554f9d5fb856fe61758086 # v1.14.3
