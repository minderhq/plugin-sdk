name: Publish to PyPI

# Publishes minder-plugin-sdk to PyPI when a GitHub Release is published.
# Uses PyPI Trusted Publishing (OIDC) — no API token/secret needed. Configure
# the trusted publisher once on PyPI: project `minder-plugin-sdk`, owner
# `minderhq`, repo `plugin-sdk`, workflow `publish.yml`, environment `pypi`.

on:
  release:
    types: [published]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build:
    name: Build sdist + wheel
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: python -m pip install --upgrade build
      - run: python -m build
      - uses: actions/upload-artifact@v4
        with:
          name: dist
          path: dist/

  pypi:
    name: Publish to PyPI
    needs: build
    runs-on: ubuntu-latest
    environment: pypi
    permissions:
      id-token: write # required for Trusted Publishing (OIDC)
    steps:
      - uses: actions/download-artifact@v4
        with:
          name: dist
          path: dist/
      # SHA-pinned, not the mutable `release/v1` branch ref this action
      # publishes its docs under (org convention since the TruffleHog
      # CVE-2026-33634 incident) -- verified via releases/latest -> git/tags
      # (an annotated tag here, dereferenced through git/tags/<sha> to the
      # actual commit) against the same v1.14.2 the branch currently points to.
      - uses: pypa/gh-action-pypi-publish@dc37677b2e1c63e2034f94d8a5b11f265b73ba33 # v1.14.2
